# Temporary: confirms the preview deployed this commit (removed after use).
name: preview-probe
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/workflows/preview-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe preview
        env:
          BASE: https://amigo-app-git-claude-amigo-worl-d67e9b-amigos-projects-73fa05d5.vercel.app
        run: |
          # The entry bundle names its lazy chunks; the Messages chunk of this build has the new actions UI.
          for i in $(seq 1 30); do
            entry=$(curl -s "$BASE/" | grep -o '/assets/index-[^"]*\.js' | head -1)
            chunk=$(curl -s "$BASE$entry" | grep -o 'assets/MessagesScreen-[A-Za-z0-9_-]*\.js' | head -1)
            if [ -n "$chunk" ] && curl -s "$BASE/$chunk" | grep -q "Load earlier messages"; then echo "attempt $i: new build live ($entry, $chunk)"; break; fi
            echo "attempt $i: not yet ($entry $chunk)"
            sleep 20
          done
          echo "--- /legal/terms status: $(curl -s -o /dev/null -w '%{http_code}' $BASE/legal/terms)"
          echo "--- legal_current via proxy (anonymous):"
          for i in 1 2 3 4 5 6; do
            out=$(curl -s -X POST "$BASE/neon/rest/v1/rpc/legal_current" -H 'Content-Type: application/json' -d '{}')
            echo "$out" | head -c 400; echo
            echo "$out" | grep -q '"slug"' && break
            sleep 15
          done
          echo "--- delete_my_account anonymous (expect denied):"
          curl -s -X POST "$BASE/neon/rest/v1/rpc/delete_my_account" -H 'Content-Type: application/json' -d '{"p_confirm":"DELETE"}' | head -c 300; echo
          echo "--- dm_unsend anonymous (expect denied):"
          curl -s -X POST "$BASE/neon/rest/v1/rpc/dm_unsend" -H 'Content-Type: application/json' -d '{"p_id":"00000000-0000-0000-0000-000000000000"}' | head -c 300; echo
          echo "--- admin_monetization_settings anonymous (expect denied):"
          curl -s -X POST "$BASE/neon/rest/v1/rpc/admin_monetization_settings" -H 'Content-Type: application/json' -d '{}' | head -c 300; echo
