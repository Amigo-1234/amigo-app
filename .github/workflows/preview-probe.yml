# Temporary: anonymous checks against the Neon Data API (removed after use).
name: preview-probe
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/workflows/preview-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous Data API checks
        env:
          API: https://ep-dry-mode-zano9y8g.apirest.c-2.eu-west-2.aws.neon.tech/neondb/rest/v1
        run: |
          post() { curl -s -m 20 -o /tmp/out -w '%{http_code}' -X POST "$API/rpc/$1" -H 'Content-Type: application/json' -d "$2"; echo " $(head -c 160 /tmp/out)"; }
          echo "legal_current (expect 200 + 7 docs):"; post legal_current '{}'; grep -o '"slug"' /tmp/out | wc -l
          echo "delete_my_account (expect 401/403):"; post delete_my_account '{"p_confirm":"DELETE"}'
          echo "dm_unsend (expect 401/403):"; post dm_unsend '{"p_id":"00000000-0000-0000-0000-000000000000"}'
          echo "dm_send_v3 (expect 401/403):"; post dm_send_v3 '{"p_id":"00000000-0000-0000-0000-000000000000","p_conversation":"00000000-0000-0000-0000-000000000000","p_device":"x","p_content":{}}'
          echo "moments_feed (expect 401/403):"; post moments_feed '{}'
          echo "admin_monetization_settings (expect 401/403):"; post admin_monetization_settings '{}'
          echo "dm_messages table (expect 401/403 or []):"; curl -s -m 20 -w ' %{http_code}\n' "$API/dm_messages?select=id&limit=1"
          echo "legal_acceptances table (expect 401/403 or []):"; curl -s -m 20 -w ' %{http_code}\n' "$API/legal_acceptances?select=user_id&limit=1"
