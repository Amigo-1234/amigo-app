# Quality gate on every push and pull request: typecheck, production build, offline
# tests, and the database rules (every migration + supabase/tests/database.test.sql)
# on a throwaway Postgres inside the runner.
#
# Nothing here reaches a deployed environment or the shared database: no secrets,
# no browsers, no network calls from the tests (they stub fetch). Live suites stay in
# the hand-started workflows (live-*.yml, prod-smoke.yml).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Offline tests (email handler, photo cache, fresh-token retry)
        run: |
          npm run -s test:auth-email
          npm run -s test:sw-cache
          npm run -s test:fresh-token

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-local
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway database (UTF-8, as on Neon)
        run: psql -v ON_ERROR_STOP=1 -d postgres -c "create database amigo_ci encoding 'UTF8' template template0 lc_collate 'C.UTF-8' lc_ctype 'C.UTF-8'"
      - name: Local stand-ins for the platform (roles, auth.uid, storage)
        run: psql -v ON_ERROR_STOP=1 -q -d amigo_ci -f supabase/tests/local_supabase_shim.sql
      - name: Every migration, in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -d amigo_ci -f "$f"
            echo "::endgroup::"
          done
      - name: Database behaviour and security tests (one transaction, rolled back)
        run: |
          psql -v ON_ERROR_STOP=1 -d amigo_ci -f supabase/tests/database.test.sql 2>&1 | tee db-test.log
          grep -q "ALL DATABASE TESTS PASSED" db-test.log
