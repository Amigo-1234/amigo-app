          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-viewers.test.mjs
      - name: "Official address: direct messages (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-messages')
        env:
