        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; xvfb-run -a node scripts/test/live-push.test.mjs
      - name: "Email: what DNS says (SPF, DKIM, DMARC, return path)"
        if: always() && (inputs.suite == 'email-dns' || inputs.suite == 'email-send')
        run: DOMAIN=amigoworld.com.ng EXPECT=resend node scripts/test/email-dns.mjs
      - name: "Email: the webhook handler on Preview refuses anything Neon didn't sign"
        if: always() && (inputs.suite == 'email-dns' || inputs.suite == 'email-send')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: BASE="https://amigo-app-git-claude-amigo-worl-d67e9b-amigos-projects-73fa05d5.vercel.app" node scripts/test/email-handler-probe.mjs
      - name: "Email: a deployment's handler refuses what Neon didn't sign, and is ready to send"
        if: always() && inputs.suite == 'email-probe'
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BASE: ${{ inputs.base }}
        run: EXPECT_ENDPOINT=ep-dry-mode-zano9y8g node scripts/test/email-handler-probe.mjs
      - name: "Email: sample branded emails through Resend"
        if: always() && inputs.suite == 'email-send'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          TEST_TO: ${{ inputs.test_to }}
        run: node scripts/test/email-send.mjs
      # Real Neon codes against the isolated test project amigo-email-test only (own Neon Auth,
      # keys and test accounts; no production data). Codes come back sealed to the job's key.
      - name: "Email codes: restore this test run's state"
        if: startsWith(inputs.suite, 'email-otp-') && inputs.suite != 'email-otp-keys' && inputs.suite != 'email-otp-start' && inputs.suite != 'email-otp-prod-start'
        uses: actions/cache/restore@v4
        with:
          path: .otp-state
          key: email-otp-${{ inputs.session }}
          fail-on-cache-miss: true
      - name: "Email codes: real Neon codes (test project, or production with email-otp-prod-*)"
        if: startsWith(inputs.suite, 'email-otp-')
        env:
          STATE_DIR: .otp-state
          SUITE: ${{ inputs.suite }}
          SESSION: ${{ inputs.session }}
          TEST_TO: ${{ inputs.test_to }}
          BLOB: ${{ inputs.blob }}
        run: |
          case "$SUITE" in
            email-otp-prod-*) export AUTH_URL=https://ep-dry-mode-zano9y8g.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth ALLOW_PRODUCTION=owner-approved STEP="${SUITE#email-otp-prod-}" ;;
            *) export AUTH_URL=https://ep-orange-shadow-zaw0o0sl.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth STEP="${SUITE#email-otp-}" ;;
          esac
          node scripts/test/email-otp-live.mjs
      - name: "Email codes: keep this test run's state for the next steps"
        if: inputs.suite == 'email-otp-start' || inputs.suite == 'email-otp-prod-start'
        uses: actions/cache/save@v4
        with:
          path: .otp-state
          key: email-otp-${{ inputs.session }}
      - name: Google sign-in probe (no sign-in)
        if: always() && inputs.suite == 'auth'
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; node scripts/test/live-oauth-probe.mjs
      - name: Admin control centre (needs an operator to grant the temporary admin)
        if: always() && inputs.suite == 'admin'
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_NONCE: ${{ inputs.admin_nonce }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; node scripts/test/live-admin.test.mjs
