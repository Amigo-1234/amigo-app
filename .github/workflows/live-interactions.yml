# Likes and replies end to end (API + the app's UI on an iPhone-sized browser) against a
# deployed environment. Runs when .github/live-interactions.run changes; its first line is
# the target URL (production or the branch preview). Temporary accounts only, deleted afterwards.
name: live-interactions
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/live-interactions.run]
  # Started by hand (no push, so the preview isn't rebuilt while the test runs).
  workflow_dispatch:
    inputs:
      base:
        description: "Target URL (default: line 1 of .github/live-interactions.run)"
        required: false
jobs:
  live-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i --no-save playwright@1.55.0 && npx playwright install --with-deps chromium webkit
      - name: Fresh sign-in token probe
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; node scripts/test/live-token-probe.mjs
      - name: Likes and replies (Chromium)
        if: always()
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-interactions.test.mjs
      - name: Likes and replies (WebKit, as in iPhone Safari)
        if: always()
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-interactions.test.mjs
      - name: Moment reactions (Chromium, 4G-like)
        if: always()
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-moment-react.test.mjs
      - name: Moment reactions (WebKit)
        if: always()
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-moment-react.test.mjs
