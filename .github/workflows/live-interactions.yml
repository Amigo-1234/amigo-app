        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-sync.test.mjs
      - name: Joining Amigo (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'onboarding')
        env:
