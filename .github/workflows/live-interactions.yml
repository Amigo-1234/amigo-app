        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-follow.test.mjs
      - name: Creator Programme (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'creator')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-creator.test.mjs
      - name: Creator Programme (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'creator')
        env:
