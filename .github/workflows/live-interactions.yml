        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-moment-photo.test.mjs
      - name: Moments taps over the feed (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'media' || inputs.suite == 'taps')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-moment-taps.test.mjs
      - name: Moments taps over the feed (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'media' || inputs.suite == 'taps')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-moment-taps.test.mjs
      - name: Bottom bar auto-hide on the feed (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'nav')
        env:
