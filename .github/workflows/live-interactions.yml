        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-creator.test.mjs
      - name: Direct messages (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'messages')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-messages.test.mjs
      - name: Direct messages (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'messages')
        env:
