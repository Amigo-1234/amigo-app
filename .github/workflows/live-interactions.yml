# Likes and replies end to end (API + the app's UI on an iPhone-sized browser) against a
# deployed environment. Runs when .github/live-interactions.run changes; its first line is
# the target URL (production or the branch preview). Temporary accounts only, deleted afterwards.
name: live-interactions
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/live-interactions.run]
  # Started by hand (no push, so the preview isn't rebuilt while the test runs).
  workflow_dispatch:
    inputs:
      base:
        description: "Target URL (default: line 1 of .github/live-interactions.run)"
        required: false
      suite:
        description: "all | likes | moments | follow | creator | messages | media | taps | nav | sync | onboarding | auth | admin (default: all except admin); official address: domain (all of its checks) | domain-auth | transition | domain-media | domain-messages | domain-sync | push; email: email-dns | email-send | email-probe (BASE: unsigned/forged refused + readiness, production endpoint expected) | email-otp-keys | email-otp-start | email-otp-verify | email-otp-reset | email-otp-expired | email-otp-prod-{start,verify,reset,expired} (production, owner-approved)"
        required: false
      test_to:
        description: "email-send / email-otp-start: the inbox that receives the emails"
        required: false
      session:
        description: "email-otp suites: a-z0-9 tag naming the test accounts and their cached state"
        required: false
      blob:
        description: "email-otp-verify | -reset | -expired: codes sealed with scripts/test/email-otp-seal.mjs"
        required: false
      old:
        description: "domain suites: the old address, kept working (default: https://amigo-app-one.vercel.app)"
        required: false
      admin_nonce:
        description: "admin suite: tag of the temporary admin account an operator grants"
        required: false
jobs:
  live-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Project dependencies (the media API test uses the app's own client)
        if: startsWith(inputs.suite, 'domain') || inputs.suite == 'transition' || inputs.suite == 'push' || inputs.suite == 'email-send'
        run: npm ci
      - if: "!startsWith(inputs.suite, 'email')"
        run: npm i --no-save playwright@1.55.0 && npx playwright install --with-deps chromium webkit
      - name: Fresh sign-in token probe
        if: inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'likes'
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; node scripts/test/live-token-probe.mjs
      - name: Likes and replies (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'likes')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-interactions.test.mjs
      - name: Likes and replies (WebKit, as in iPhone Safari)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'likes')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-interactions.test.mjs
      - name: Moment reactions (Chromium, 4G-like)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'moments')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-moment-react.test.mjs
      - name: Moment reactions (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'moments')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
