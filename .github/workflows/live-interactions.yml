        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=chromium node scripts/test/live-viewers.test.mjs
      - name: "Official address: viewers and sheets (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-media')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-viewers.test.mjs
      - name: "Official address: direct messages (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-messages')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=chromium node scripts/test/live-messages.test.mjs
      - name: "Official address: direct messages (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-messages')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-messages.test.mjs
      - name: "Official address: likes and replies (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-sync')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-interactions.test.mjs
      - name: "Official address: live sync and in-app notifications (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-sync')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=chromium node scripts/test/live-sync.test.mjs
