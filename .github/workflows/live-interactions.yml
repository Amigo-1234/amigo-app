        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-sync.test.mjs
      - name: Joining Amigo (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'onboarding')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-onboarding.test.mjs
      - name: Joining Amigo (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'onboarding')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-onboarding.test.mjs
      - name: "Official address: redirects, metadata, auth service, sign-in (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-auth')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=chromium node scripts/test/live-domain.test.mjs
      - name: "Official address: sign-in (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-auth')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-domain.test.mjs
      - name: "Official address: exposure checks (read-only)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-auth')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; node scripts/test/prod-exposure.test.mjs
      - name: "Official address: moving with encrypted messages (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'transition')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=chromium node scripts/test/live-device-transition.test.mjs
      - name: "Official address: moving with encrypted messages (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'transition')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-device-transition.test.mjs
      - name: "Official address: photos, Moments, avatars, message photos, R2 CORS (API)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-media')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; node scripts/test/live-media.test.mjs
      - name: "Official address: photos in an iPhone browser"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-media')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        timeout-minutes: 12
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; mkdir -p shots && SHOTS=shots node scripts/test/live-mobile.test.mjs
      - name: "Official address: photo Moments, 24 MP and EXIF (WebKit)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-media')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-moment-photo.test.mjs
      - name: "Official address: viewers and sheets (Chromium)"
        if: always() && (inputs.suite == 'domain' || inputs.suite == 'domain-media')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
