        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-moment-photo.test.mjs
      - name: Photo Moments (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'media')
        env:
