        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-bottom-nav.test.mjs
      - name: Bottom bar auto-hide on the feed (WebKit)
