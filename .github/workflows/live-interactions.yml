        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-viewers.test.mjs
      - name: Live sync, two accounts (Chromium)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'sync')
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=chromium node scripts/test/live-sync.test.mjs
      - name: Live sync, two accounts (WebKit)
        if: always() && (inputs.suite == '' || inputs.suite == 'all' || inputs.suite == 'sync')
        env:
