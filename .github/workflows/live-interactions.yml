          OLD: ${{ inputs.old || 'https://amigo-app-one.vercel.app' }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-https://amigoworld.com.ng}"; ENGINE=webkit node scripts/test/live-moment-photo.test.mjs
