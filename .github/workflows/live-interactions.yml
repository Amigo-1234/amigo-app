        if: always() && inputs.suite == 'admin'
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ADMIN_NONCE: ${{ inputs.admin_nonce }}
        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; node scripts/test/live-admin.test.mjs
