        run: export BASE="${{ inputs.base }}"; export BASE="${BASE:-$(head -1 .github/live-interactions.run)}"; ENGINE=webkit node scripts/test/live-moment-taps.test.mjs
      - name: Bottom bar auto-hide on the feed (Chromium)
