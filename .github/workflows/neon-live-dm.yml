# TEMPORARY (removed after use): runs the live Neon messaging test from a
# runner that can reach Neon (the dev sandbox can't).
# run 3
name: neon-live-dm
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/workflows/neon-live-dm.yml]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:neon-live
        env:
          NEON_AUTH_URL: https://ep-dry-mode-zano9y8g.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
          NEON_DATA_API_URL: https://ep-dry-mode-zano9y8g.apirest.c-2.eu-west-2.aws.neon.tech/neondb/rest/v1
          APP_ORIGIN: https://amigo-app-git-claude-amigo-worl-d67e9b-amigos-projects-73fa05d5.vercel.app
