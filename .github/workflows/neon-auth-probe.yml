# TEMPORARY diagnostic (removed after use): checks how Neon Auth answers a
# sign-up request directly vs. with the headers Vercel's rewrite proxy adds.
# Uses a too-short password, so no account can be created.
name: neon-auth-probe
on:
  push:
    branches: [claude/amigo-world-restart-7mrbrf]
    paths: [.github/workflows/neon-auth-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://ep-dry-mode-zano9y8g.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
          O=https://amigo-app-git-claude-amigo-worl-d67e9b-amigos-projects-73fa05d5.vercel.app
          B='{"email":"probe.amigo@gmail.com","password":"x","name":"probe"}'
          probe() { echo "== $1"; shift; curl -sS -i -X POST "$A/sign-up/email" -H 'content-type: application/json' "$@" -d "$B" | grep -iv '^set-cookie\|^date\|^cf-\|^report\|^nel' | head -20; echo; }
          probe "direct, origin" -H "origin: $O"
          probe "proxy-like (x-forwarded-host)" -H "origin: $O" -H "x-forwarded-host: ${O#https://}" -H "x-forwarded-proto: https" -H "x-forwarded-for: 1.2.3.4"
          probe "proxy-like (x-vercel headers)" -H "origin: $O" -H "x-forwarded-host: ${O#https://}" -H "x-vercel-id: iad1::abc" -H "x-real-ip: 1.2.3.4" -H "forwarded: for=1.2.3.4;host=${O#https://};proto=https"
