# Real Neon-generated verification and reset codes, delivered as branded emails, against the
# isolated test project amigo-email-test (its own Neon Auth, keys and test accounts; no
# production data). See scripts/test/email-otp-live.mjs. Codes come back sealed to the
# job's own key (BLOB), never in plain text.
name: email-otp-live
on:
  workflow_dispatch:
    inputs:
      step:
        description: "keys | start | verify | reset | expired"
        required: true
      session:
        description: "a-z0-9 tag for this test run (names the test accounts and the cached state)"
        required: false
      test_to:
        description: "start: the inbox (plain address; test accounts use +aliases of it)"
        required: false
      blob:
        description: "verify | reset | expired: codes sealed with scripts/test/email-otp-seal.mjs"
        required: false
jobs:
  email-otp-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_URL: https://ep-orange-shadow-zaw0o0sl.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      STATE_DIR: .otp-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore this run's state
        if: inputs.step != 'keys' && inputs.step != 'start'
        uses: actions/cache/restore@v4
        with:
          path: .otp-state
          key: email-otp-${{ inputs.session }}
          fail-on-cache-miss: true
      - name: "Email codes: ${{ inputs.step }}"
        env:
          STEP: ${{ inputs.step }}
          SESSION: ${{ inputs.session }}
          TEST_TO: ${{ inputs.test_to }}
          BLOB: ${{ inputs.blob }}
        run: node scripts/test/email-otp-live.mjs
      - name: Keep this run's state for the next steps
        if: inputs.step == 'start'
        uses: actions/cache/save@v4
        with:
          path: .otp-state
          key: email-otp-${{ inputs.session }}
