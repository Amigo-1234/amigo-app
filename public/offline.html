<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Offline · Amigo World</title>
    <style>
      :root { color-scheme: light dark; --bg: #f8f7f4; --text: #1a1a1a; --muted: #6b6b6b; --accent: #ff5a3c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0e; --text: #f2f2f2; --muted: #a0a0a0; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 12px 24px; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Amigo World needs a connection. Your messages stay safe on your device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
