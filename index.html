<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Amigo World</title>
    <meta name="description" content="Amigo World — posts, moments and conversations with your people." />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Sharing previews: generic on purpose. Content needs a sign-in, so no page-specific (or private) data is ever put in metadata. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amigo World" />
    <meta property="og:title" content="Amigo World" />
    <meta property="og:description" content="Posts, Moments, Worlds and end-to-end encrypted conversations with your people." />
    <meta property="og:url" content="https://amigoworld.com.ng/" />
    <meta property="og:image" content="https://amigoworld.com.ng/icons/icon-512.png" />
    <meta property="og:image:alt" content="Amigo World" />
    <meta name="twitter:card" content="summary" />
    <!-- The official address. Every copy of the app (the old Vercel address included) points search engines here; the path is filled in below. -->
    <link rel="canonical" href="https://amigoworld.com.ng/" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Amigo" />
    <script>
      // Canonical: the official address with this page's path (no query: nothing private ends up in it).
      try {
        document.querySelector('link[rel="canonical"]').href = "https://amigoworld.com.ng" + location.pathname;
      } catch (e) {}
      // Apply a saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("amigo:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Shown by the browser at once while the app downloads (slow networks); React replaces it. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f8f7f4; }
      .boot svg { width: 56px; height: 56px; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { background: #0c0c0e; } }
      :root[data-theme="dark"] .boot { background: #0c0c0e; }
    </style>
    <div id="root"><div class="boot" role="status" aria-label="Loading Amigo World"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#ff5a3c" d="M9 0h14a9 9 0 0 1 9 9v14a9 9 0 0 1-9 9H3a3 3 0 0 1-3-3V9a9 9 0 0 1 9-9z"/><circle cx="14.6" cy="17.2" r="5.6" fill="none" stroke="#1d0a05" stroke-width="3.3"/><rect x="19.6" y="10" width="3.3" height="13" rx="1.65" fill="#1d0a05"/></svg></div></div>
    <noscript>Amigo World needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
